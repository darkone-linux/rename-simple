version: 2

updates:
  # Cargo dependencies. Grouped into a single PR so the lockfile is refreshed in
  # one reviewable change instead of one PR per crate; the CI quality gate plus
  # the MSRV job decide whether the group is safe to merge.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    # Major bumps stay individual: they are the ones that can break the MSRV
    # floor or the build (cf. the syn 2 -> 3 jump).
    ignore: []

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"

  # Nix flake inputs. Dependabot reads flake.lock and tracks input commits the
  # way it tracks git submodules, opening one PR per outdated input — with a
  # single `nixpkgs` input that means one PR. Version updates only; the nix
  # ecosystem has no security-update support.
  #
  # Two things this does NOT cover, both still manual:
  #   - refs pinned inside flake.nix itself (we pin none);
  #   - the nixpkgs revision pinned in shell.nix, which is a fetchTarball and
  #     not a flake input. That pin is deliberate — it keeps `nix develop` and
  #     `nix-shell` on one toolchain — so bump it by hand, per shell.nix.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(nix)"
