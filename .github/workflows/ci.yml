name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          # v21 flipped this default to `true`, which swaps upstream Nix for
          # Determinate Nix (separate EULA) and logs in to FlakeHub. Nothing
          # here needs either, so keep installing what v6 installed.
          determinate: false

      # Delegate to `just ci` so the gate has a single definition. Spelling the
      # steps out here is what let CI drift: it used to run `cargo fmt --all`
      # (rewrite mode, always exit 0) and skipped audit and doc entirely.
      - name: Run full quality gate
        run: nix-shell shell.nix --run "just ci"

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Read the floor straight from Cargo.toml so this job can never disagree
      # with the declared value.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # Check what a consumer actually builds (lib + bin), not dev-dependencies:
      # a dev-dep raising its own floor must not fail the published MSRV.
      - name: Check build on MSRV
        run: cargo check --all-features --locked

  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Same reason as the quality gate job: stay on upstream Nix.
          determinate: false
          # The installer enables flakes by default; pin the behaviour so a
          # change of default cannot silently break this job. Written at install
          # time rather than appended to /etc/nix/nix.conf afterwards, so the
          # setting is in place before the first nix invocation.
          extra-conf: experimental-features = nix-command flakes

      # Kept in its own job so a failing quality gate still tells us whether the
      # packaging derivation builds.
      - name: Build flake package
        run: nix build .#rename-simple
