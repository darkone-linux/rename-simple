[package]
name = "rename-simple"
version = "0.5.0"
edition = "2021"
# Floor imposed by the dependency graph: clap 4.6 and assert_cmd 2.2 both
# declare rust-version = "1.85". Resolver v3 makes cargo honour this during
# resolution instead of silently picking versions the floor cannot build.
rust-version = "1.85"
resolver = "3"
description = "Rename files by normalizing accented characters, spaces and special chars to clean ASCII slugs"
license = "MIT"
repository = "https://github.com/darkone-linux/rename-simple"
readme = "README.md"
keywords = ["rust", "cli", "rename"]
categories = ["command-line-utilities"]
# Keep the published tarball to what a consumer needs: sources, tests, README,
# CHANGELOG and the man page. Development tooling and agent instructions are
# repo-only, and that includes the Nix packaging files: `flake.nix`,
# `flake.lock` and `shell.nix` describe how to build and hack on the repo, not
# how to consume the crate — Nix users take the flake from git, not crates.io.
# The README references its screenshot by absolute raw.githubusercontent URL,
# so `assets/` can stay excluded without breaking the crates.io rendering.
exclude = [
    ".envrc",
    ".github/",
    ".gitignore",
    "AGENTS.md",
    "Justfile",
    "TECH-NOTES.md",
    "assets/",
    "flake.lock",
    "flake.nix",
    "shell.nix",
]

[[bin]]
name = "rename-simple"
path = "src/main.rs"

[lib]
name = "rename_files"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
unicode-normalization = "0.1"

# Used on Linux for renameat2(RENAME_NOREPLACE): refuses to overwrite the
# destination, closing the TOCTOU window between `op.to.exists()` and
# `fs::rename`. macOS/BSD fall back to a pre-check + std::fs::rename.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
